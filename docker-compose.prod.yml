# Боевой слой: Caddy получает сертификат Let's Encrypt сам.
# Образ приложения уже загружен (deploy/push-image.sh). Сборки здесь нет:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build

services:
  app:
    pull_policy: never
    volumes:
      - ./config:/app/config:ro
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
