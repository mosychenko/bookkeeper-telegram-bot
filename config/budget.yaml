# Обязательные, гибкие и редкие статьи.
# Классификация от ведущего таблицы, лист «Ноябрь», 2026-11-04.
#
# Суммы периода читаются из листа: колонка C это зарплата (5-е),
# колонка D это аванс (20-е). Пустая ячейка значит «в этом периоде
# статьи нет». Список periods ограничивает, какие колонки вообще
# участвуют. Даты из октябрьской выписки. «?» в источнике значит,
# что дата не задана и на экране будет «дата ?».
#
# Строки 14 «Кредиты:» и 22 «Карманные» это заголовки групп, не статьи.
# Строка 44 «Сбережения» ниже сумм 5–42. Сумму копилки приложение
# считает само (savings_rate), ячейку C44 как константу не копирует.
#
# Не подтверждено, меняется прямо в этом файле:
# 1. Тип «Здоровье» и «Секции». «Образование (курсы)» уже гибкая.
#    Перенесите пункт между mandatory, flexible и rare.
# 2. «Кредиты Женя»: advance_if_blank. 0 оставляет пустую ячейку листа
#    (в ноябре пусто). 5000 подставит обычную сумму в период аванса.
# 3. «Школа»: список periods. Уберите salary или advance, и колонка
#    C или D не попадёт в период. Сумма по-прежнему из листа.
#    В ноябре C это 58 000, D это 105 400 (58 000 + 47 400 предоплата
#    за следующий месяц).

payday:
  salary_day: 5
  advance_day: 20

mandatory:
  - id: utilities
    name: "Коммунальные платежи"
    category: "Коммунальные платежи"
    periods: [salary, advance]
    due_salary:
      day: 13

  - id: internet
    name: "Интернет"
    category: "Интернет"
    periods: [advance]
    due_advance:
      day: 28

  - id: mobile
    name: "Мобильная связь"
    category: "Мобильная связь"
    periods: [salary]
    due_salary:
      day: 7

  - id: pocket
    name: "Карманные детям"
    category: "Карманные детям"
    periods: [salary, advance]
    due_range: [20, 25]

  - id: school
    name: "Школа"
    category: "Школа"
    # Не подтверждено: разбивка по колонкам. Уберите лишний период.
    periods: [salary, advance]
    due_days: [6, 25]

  - id: feed
    name: "Корм питомцам"
    category: "Корм питомцам"
    periods: [advance]
    due_range: [22, 31]

  - id: therapy
    name: "Психотерапевт"
    category: "Психотерапевт"
    periods: [salary, advance]

  - id: mortgage
    name: "Ипотека"
    category: "Ипотека"
    periods: [salary]
    # 47 485 списывается 10-го. Страховка 300 входит в эту же строку
    # и списывается отдельно 23-го, отдельной статьёй не заводится.
    due_days: [10, 23]

  - id: maxim_loan
    name: "Кредит Максим"
    category: "Кредит Максим"
    periods: [advance]
    due_advance:
      day: 26

  - id: wife_card
    name: "Кредитка Женя"
    category: "Кредитка Женя"
    periods: [salary]

  - id: wife_loans
    name: "Кредиты Женя"
    category: "Кредиты Женя"
    # Не подтверждено: 0 или 5000. Сейчас 0, как пустая ячейка ноября.
    periods: [advance]
    advance_if_blank: 0

  - id: premises
    name: "Помещение"
    category: "Помещение"
    periods: [salary]
    due_salary:
      day: 12

  - id: mom
    name: "Маме"
    category: "Маме"
    periods: [advance]

  - id: abika
    name: "Абика"
    category: "Абика"
    # Долг 15 000, плана в ноябре нет. Появится в том периоде,
    # где в листе будет сумма. Дата неизвестна.

  - id: auto
    name: "Авто"
    category: "Авто"
    periods: [advance]
    due_text: "по факту"

  - id: subs
    name: "Подписки"
    category: "Подписки"
    periods: [salary, advance]
    due_range: [20, 23]

  - id: boxing
    name: "Бокс Женя"
    category: "Бокс Женя"
    periods: [salary]

  - id: savings
    name: "Сбережения (Копилка 10%)"
    category: "Сбережения (Копилка 10%)"
    # Сумма не из ячейки. 10% зарплат этого периода, а пока их нет —
    # 10% плана периода (C3 или D3). Аренда добавляется целиком.
    periods: [salary, advance]

flexible:
  - category: "Продукты"
  - category: "Бизнес"
  - category: "Кафе"
  - category: "Развлечения"
  - category: "Бытовая химия"
  # Не подтверждено: тип. Перенесите в mandatory или rare.
  - category: "Здоровье"
  - category: "Транспорт"
  - category: "Красота"
  - category: "Одежда"
  # Не подтверждено: тип. Перенесите в mandatory или rare.
  - category: "Секции"
  - category: "Расходы на питомцев прочее"
  - category: "Дети прочее"
  - category: "Образование (курсы)"
    operations_name: "Образование"
  - category: "Курилка"
  - category: "Прочее"

# Редкие статьи считаются как гибкие в темпе и в «откуда взять».
# На экран попадают только если в этом периоде есть план или факт.
rare:
  - category: "Концерты"
  - category: "Подарки"
  - category: "Дизайн квартиры"
  - category: "Путешествия"

# Запас, если ячейка планового дохода пустая. В ноябре и октябре
# C3 = 270 000, D3 = 250 000, так что запас не используется.
income_defaults:
  salary: 270000
  advance: 250000

# Только эти категории считаются зарплатой (Максим и Женя).
# «Прочие поступления» сюда не входят. Заём доходом не является.
salary_income_categories:
  - "Зарплата"
  - "Отпускные"
  - "Аванс"
  - "Доход Женя"

# Эти категории никогда не попадают в свободные деньги.
# Их полная сумма прибавляется к копилке.
# Аренда это два прихода ровно 5 000 и 22 000 ₽, целиком в копилку.
# В листе категории ещё нет. Когда появится имя, добавьте его одной строкой:
#   - "Аренда"
excluded_income_categories: []

# Доля зарплат периода, которая уходит в копилку.
savings_rate: 0.10

# Колонка «Статус» листа «Операции». «Выполнено» это оплачено.
# «В обработке» и «Вручную» оплатой не считаются.
paid_status_values:
  - "Выполнено"
