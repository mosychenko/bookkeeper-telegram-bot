# Раскладка книги «Бюджет», сверена с живым листом 2026-11-04.
# Приложение таблицу не изменяет: только values.get и scope spreadsheets.readonly.

operations:
  sheet: "Операции"
  header_row: 1
  read_columns: "A:M"
  columns:
    date: "A"              # Дата
    month: "B"             # Месяц
    account: "C"           # Счёт
    description: "D"       # Описание
    comment: "E"           # Комментарий
    amount: "F"            # Сумма
    type: "G"              # Тип
    bank_category: "H"     # Категория банка
    mcc: "I"               # MCC
    budget_category: "J"   # Категория бюджета
    fact: "K"              # Расход (для Факт)
    status: "L"            # Статус
    savings: "M"           # Копилка (движение)
  expect_headers:
    A: "Дата"
    B: "Месяц"
    C: "Счёт"
    D: "Описание"
    E: "Комментарий"
    F: "Сумма"
    G: "Тип"
    H: "Категория банка"
    I: "MCC"
    J: "Категория бюджета"
    K: "Расход (для Факт)"
    L: "Статус"
    M: "Копилка (движение)"

types:
  expense: "Расход"
  excluded: "Исключено"
  income: "Доход"
  loan: "Заём"
  cash: "Наличные"

monthly:
  header_row: 1
  first_data_row: 5
  read_range: "A1:J44"
  columns:
    category: "A"        # имя с префиксом «- », иначе пусто у кредитов
    subcategory: "B"     # имя кредита, если A пустая; переводы строк схлопываются
    plan_salary: "C"     # план с зарплаты (5-е)
    plan_advance: "D"    # план с аванса (20-е)
    fact: "E"
    diff: "F"
    comment: "G"
  # Строка 3 «Доход»: C план зарплаты, D план аванса.
  # E3 это сумма факта расходов, не доход.
  income_plan:
    row: 3
    label: "Доход"
    label_column: "A"
    salary_column: "C"
    advance_column: "D"
  # Факт прихода в блоке I:J. Ноль в ячейке это известный ноль, не пустота.
  income_actual:
    salary:
      row: 3
      column: "J"
      label: "Зарплата (вкл. отпускные)"
      label_column: "I"
    advance:
      row: 4
      column: "J"
      label: "Аванс"
      label_column: "I"
    wife:
      row: 5
      column: "J"
      label: "Доход Женя"
      label_column: "I"
    # J6 и J8 читаются только чтобы поймать сдвиг колонки.
    # В доход периода и в копилку они не входят.
    other:
      row: 6
      column: "J"
      label: "Прочие поступления"
      label_column: "I"
    loan:
      row: 8
      column: "J"
      label: "Заём у мамы (не доход)"
      label_column: "I"
  expect_headers:
    A1: "Категория"
    B1: "Подкатегории"
    C1: "План"
    E1: "Факт"
    F1: "Разница"
    G1: "Комментарий"
    C2: "Зарплата"
    D2: "Аванс"

# Факт на экране берётся из колонки E месячного листа.
# Формулы листа уже считают SUMIFS по колонке K операций.
fact_source: monthly

# Колонка «прошлый месяц» у гибких статей.
last_month_fact: monthly
