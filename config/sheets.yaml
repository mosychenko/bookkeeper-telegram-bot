# Раскладка книги «Бюджет».
#
# Лист «Операции» описан тем, кто его ведёт: колонки A-M ниже.
# Приложение сверяет заголовки и отказывается читать, если они разъехались.
#
# Месячные листы («Октябрь», «Ноябрь», …) в коде НЕ угаданы.
# Колонки category / plan_salary / plan_advance / fact — черновик.
# Прежде чем ставить DATA_SOURCE=sheets, откройте живой лист и поправьте
# буквы колонок, номер строки данных и имена строк «Зарплата» и «Аванс».
# Приложение таблицу не изменяет.

operations:
  sheet: "Операции"
  header_row: 1
  read_columns: "A:M"
  columns:
    date: "A"              # Дата
    month: "B"             # Месяц
    account: "C"           # Счёт
    description: "D"       # Описание
    comment: "E"           # Комментарий
    amount: "F"            # Сумма
    type: "G"              # Тип
    bank_category: "H"     # Категория банка
    mcc: "I"               # MCC
    budget_category: "J"   # Категория бюджета
    fact: "K"              # Расход (для факта)
    status: "L"            # Статус
    savings: "M"           # Копилка
  expect_headers:
    A: "Дата"
    B: "Месяц"
    C: "Счёт"
    D: "Описание"
    E: "Комментарий"
    F: "Сумма"
    G: "Тип"
    H: "Категория банка"
    I: "MCC"
    J: "Категория бюджета"
    K: "Расход (для факта)"
    L: "Статус"
    M: "Копилка"

types:
  expense: "Расход"
  excluded: "Исключено"
  income: "Доход"
  loan: "Заём"
  cash: "Наличные"

monthly:
  header_row: 1
  first_data_row: 2
  # VERIFY: черновик. Поправьте под реальный лист.
  read_range: "A1:H200"
  columns:
    category: "A"       # VERIFY
    plan_salary: "B"    # VERIFY: план с зарплаты (5-е)
    plan_advance: "C"   # VERIFY: план с аванса (20-е)
    fact: "D"           # VERIFY: факт месяца
  # VERIFY: как называются строки прихода. Пустая ячейка — не ноль,
  # а «лимит не задан» для статей и «приход неизвестен» для зарплаты.
  income_rows:
    salary: "Зарплата"  # VERIFY
    advance: "Аванс"    # VERIFY
  # Когда заголовки месячного листа будут известны, раскомментируйте
  # и впишите точный текст. Пока проверка выключена, чтобы черновик
  # не ронял чтение из-за несуществующих заголовков.
  expect_headers: {}

# Откуда брать факт гибкой статьи на экране.
# monthly — колонка факта месячного листа (как описал ведущий таблицы).
# operations — сумма колонки K по датам периода.
fact_source: monthly

# Колонка «прошлый месяц» у гибких статей.
last_month_fact: monthly
